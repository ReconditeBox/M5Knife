name: M5Knife firmware build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: PlatformIO / Cardputer Adv
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check version and embedded assets
        run: python scripts/check_release.py

      - name: Install pinned PlatformIO Core
        run: python -m pip install platformio==6.1.19

      - name: Cache PlatformIO platforms and packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-cardputer-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-cardputer-

      - name: Build M5Stack Cardputer Adv firmware
        run: pio run -e m5stack-cardputer-adv

      - name: Verify built firmware
        shell: bash
        run: |
          test -s .pio/build/m5stack-cardputer-adv/firmware.bin
          ls -lh .pio/build/m5stack-cardputer-adv/*.bin

      - name: Upload unflashed build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m5knife-cardputer-adv-${{ github.sha }}
          path: |
            .pio/build/m5stack-cardputer-adv/firmware.bin
            .pio/build/m5stack-cardputer-adv/bootloader.bin
            .pio/build/m5stack-cardputer-adv/partitions.bin
          if-no-files-found: error
          retention-days: 14
